name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare dataset using existing data loader
        run: |
          python src/data_loader.py

      - name: Run training pipeline
        run: |
          python src/train.py

      - name: Verify MLflow state and champion model
        run: |
          python -c "
          import os, mlflow
          from mlflow.tracking import MlflowClient
          from src.mlflow_utils import setup_mlflow_experiment, get_tracking_uri

          tracking_uri = get_tracking_uri()
          setup_mlflow_experiment('Energy Consumption Prediction')

          print('=' * 60)
          print('[CI DIAGNOSTIC] Current Working Directory:', os.getcwd())
          print('[CI DIAGNOSTIC] Resolved MLflow Tracking URI:', tracking_uri)
          print('[CI DIAGNOSTIC] Active MLflow Registry URI:', mlflow.get_registry_uri())
          print('=' * 60)

          client = MlflowClient()
          reg_models = [m.name for m in client.search_registered_models()]
          print('[CI DIAGNOSTIC] Registered Models:', reg_models)
          assert 'EnergyConsumptionModel' in reg_models, 'EnergyConsumptionModel not found in registry!'

          model_version = client.get_model_version_by_alias('EnergyConsumptionModel', 'champion')
          assert model_version is not None, 'champion alias does not exist in MLflow registry!'
          print('[CI DIAGNOSTIC] Champion Version:', model_version.version)

          model = mlflow.pyfunc.load_model('models:/EnergyConsumptionModel@champion')
          assert model is not None, 'Failed to load champion model!'
          print('[CI VERIFICATION SUCCESS] MLflow state, champion alias, and model registry verified.')
          "

      - name: Run pytest suite
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t energy-consumption-mlops:latest .
