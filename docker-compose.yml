version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: energy-consumption-mlops:latest
    container_name: energy_consumption_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=deployment_model
      - MODEL_NAME=EnergyConsumptionModel
      - MODEL_ALIAS=champion
      - MLFLOW_DISABLE_AGENT_HINT=1
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5175
      - CORS_ORIGIN_REGEX=^https?://(localhost|127\.0\.0\.1)(:\d+)?$|^https://.*\.vercel\.app$
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
